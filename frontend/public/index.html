<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFL Game Predictor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Live Infinite Score Ticker Wheel -->
    <div class="ticker-wrap">
      <div class="ticker" id="ticker-content">
        <div class="game-card">Loading live scores...</div>
      </div>
    </div>

    <main>
      <div class="card">
        <h1>NFL Game Predictor</h1>

        <div id="loading" class="loading">
          <p class="loading-text">Warming up the model...</p>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Model training progress">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <p id="loadingPercent" class="loading-percent">0%</p>
          <p id="loadingHint" class="loading-hint">Starting the model...</p>
        </div>

        <div id="app" hidden>
          <div class="grid">
            <label>
              Home Team
              <select id="homeTeam"></select>
            </label>
            <label>
              Away Team
              <select id="awayTeam"></select>
            </label>
          </div>
          <button id="predictBtn" type="button">Calculate Game Odds</button>
          <p id="error" class="error" hidden></p>
          <div id="result" class="result" hidden></div>
        </div>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>

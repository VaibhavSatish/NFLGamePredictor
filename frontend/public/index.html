<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFL Game Predictor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <div class="card">
        <h1>NFL Game Predictor</h1>

        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p class="loading-text">Warming up the model...</p>
          <p class="loading-hint">Training on 2015-2025 play-by-play data. This can take a few minutes on first start.</p>
        </div>

        <div id="app" hidden>
        <div class="grid">
          <label>
            Home Team
            <select id="homeTeam"></select>
          </label>
          <label>
            Away Team
            <select id="awayTeam"></select>
          </label>
        </div>
        <button id="predictBtn" type="button">Calculate Game Odds</button>
        <p id="error" class="error" hidden></p>
        <div id="result" class="result" hidden></div>
        </div>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
